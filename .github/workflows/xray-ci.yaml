name: xray-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Validate metadata and Go source
        run: |
          set -euo pipefail
          bash test/validate-metadata.sh
          docker run --rm -v "$PWD:/src:ro" -w /src golang:1.24.6-alpine3.22@sha256:c8c5f95d64aa79b6547f3b626eb84b16a7ce18a139e3e9ca19a8c078b85ba80d sh -ec '
            test -z "$(gofmt -l cmd)"
            go vet ./...
            go test ./...
          '
      - name: Build exactly one local ARM64 candidate
        run: docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load --tag local/xray-ci:${{ github.sha }} --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Test the actual final image
        run: IMAGE=local/xray-ci:${{ github.sha }} bash test/integration/run.sh
