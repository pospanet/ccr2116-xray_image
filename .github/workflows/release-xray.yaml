name: release-xray

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate final tag and accepted RC provenance
        id: release
        shell: bash
        run: bash test/validate-final-release.sh preauth "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_OUTPUT"
      - name: Require Docker Hub server-side tag immutability
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v jq >/dev/null
          namespace=${IMAGE_NAME%%/*}
          repository=${IMAGE_NAME#*/}
          [[ -n "$namespace" && -n "$repository" && "$namespace/$repository" == "$IMAGE_NAME" ]]
          response=$(mktemp)
          trap 'rm -f -- "$response"' EXIT
          curl --fail --silent --show-error --proto '=https' \
            "https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}" \
            > "$response"
          jq -e --arg namespace "$namespace" --arg repository "$repository" '
            .namespace == $namespace and .name == $repository
          ' "$response" >/dev/null
          enabled=$(jq -er '.immutable_tags_settings.enabled | tostring' "$response")
          all_tag_rule_count=$(jq -er '[.immutable_tags_settings.rules[]? | select(. == ".*")] | length' "$response")
          bash test/validate-final-release.sh validate-immutability "$enabled" "$all_tag_rule_count"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Authenticate only after all credential-free gates pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the exact accepted RC manifest without rebuilding
        shell: bash
        env:
          ACCEPTED_RC_TAG: ${{ steps.release.outputs.accepted_rc_tag }}
          ACCEPTED_MANIFEST_DIGEST: ${{ steps.release.outputs.accepted_manifest_digest }}
          ACCEPTED_SOURCE_SHA: ${{ steps.release.outputs.accepted_source_sha }}
          FINAL_IMAGE: ${{ steps.release.outputs.final_image }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          RC_IMAGE: ${{ steps.release.outputs.rc_image }}
          WRAPPER_RELEASE: ${{ steps.release.outputs.release }}
          XRAY_VERSION: ${{ steps.release.outputs.xray_version }}
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          command -v jq >/dev/null
          docker buildx version >/dev/null

          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          source test/final-release-workflow-helpers.sh

          if accepted_digest=$(inspect_reference "$RC_IMAGE" accepted-rc "$ACCEPTED_MANIFEST_DIGEST"); then
            accepted_status=0
          else
            accepted_status=$?
          fi
          if (( accepted_status != 0 )); then
            if bash test/validate-final-release.sh require-rc-state missing; then
              echo 'invalid accepted RC state validation result' >&2
            fi
            exit 1
          fi
          if bash test/validate-final-release.sh require-rc-state present; then
            :
          else
            exit 1
          fi
          if [[ "$accepted_digest" != "$ACCEPTED_MANIFEST_DIGEST" ]]; then
            echo 'accepted RC digest differs from accepted provenance' >&2
            exit 1
          fi

          source_reference="${IMAGE_NAME}@${accepted_digest}"
          if pinned_digest=$(inspect_reference "$source_reference" accepted-digest "$accepted_digest"); then
            :
          else
            exit 1
          fi
          if [[ "$pinned_digest" != "$accepted_digest" ]]; then
            echo 'accepted digest reference changed unexpectedly' >&2
            exit 1
          fi

          final_error="$work_dir/final-inspect-error"
          if final_digest=$(inspect_reference "$FINAL_IMAGE" final-image 2>"$final_error"); then
            final_status=0
          else
            final_status=$?
          fi
          if (( final_status == 0 )); then
            if decision=$(bash test/validate-final-release.sh decide-final "$accepted_digest" present "$final_digest"); then
              :
            else
              exit 1
            fi
          elif (( final_status == INSPECT_REFERENCE_LOOKUP_FAILED )); then
            if bash test/validate-final-release.sh missing-error "$FINAL_IMAGE" "$final_error"; then
              :
            else
              exit 1
            fi
            if decision=$(bash test/validate-final-release.sh decide-final "$accepted_digest" missing); then
              :
            else
              exit 1
            fi
          else
            echo 'final image inspection failed after the registry lookup; state is indeterminate' >&2
            exit 1
          fi

          if current_rc_digest=$(inspect_reference "$RC_IMAGE" rc-before-promotion "$accepted_digest"); then
            :
          else
            exit 1
          fi
          if [[ "$current_rc_digest" != "$accepted_digest" ]]; then
            echo 'RC digest changed before promotion' >&2
            exit 1
          fi

          if [[ "$decision" == promote ]]; then
            docker buildx imagetools create --dry-run --prefer-index=false \
              --tag "$FINAL_IMAGE" "$source_reference" >/dev/null

            # Close the ordinary check/use window immediately before the only
            # registry mutation. Docker Hub's required all-tag immutability is
            # the server-side backstop against concurrent overwrites.
            if final_digest=$(inspect_reference "$FINAL_IMAGE" final-recheck 2>"$final_error"); then
              final_status=0
            else
              final_status=$?
            fi
            if (( final_status == 0 )); then
              if decision=$(bash test/validate-final-release.sh decide-final "$accepted_digest" present "$final_digest"); then
                :
              else
                exit 1
              fi
            elif (( final_status == INSPECT_REFERENCE_LOOKUP_FAILED )); then
              if bash test/validate-final-release.sh missing-error "$FINAL_IMAGE" "$final_error"; then
                :
              else
                exit 1
              fi
              if decision=$(bash test/validate-final-release.sh decide-final "$accepted_digest" missing); then
                :
              else
                exit 1
              fi
            else
              echo 'final image recheck failed after the registry lookup; state is indeterminate' >&2
              exit 1
            fi
          fi

          if [[ "$decision" == promote ]]; then
            promotion_metadata="$work_dir/promotion-metadata.json"
            docker buildx imagetools create --prefer-index=false \
              --tag "$FINAL_IMAGE" \
              --metadata-file "$promotion_metadata" \
              "$source_reference"
            if promoted_digest=$(jq -er '
              ."containerimage.descriptor".digest
              | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
            ' "$promotion_metadata"); then
              :
            else
              exit 1
            fi
            if bash test/validate-final-release.sh validate-promotion "$accepted_digest" "$promoted_digest"; then
              :
            else
              exit 1
            fi
          elif [[ "$decision" == idempotent ]]; then
            echo 'final tag already resolves to the accepted digest; no registry mutation performed'
          else
            echo 'invalid promotion decision' >&2
            exit 1
          fi

          if post_rc_digest=$(inspect_reference "$RC_IMAGE" rc-after-promotion "$accepted_digest"); then
            :
          else
            exit 1
          fi
          if post_final_digest=$(inspect_reference "$FINAL_IMAGE" final-after-promotion "$accepted_digest"); then
            :
          else
            exit 1
          fi
          if bash test/validate-final-release.sh verify-post "$accepted_digest" "$post_rc_digest" "$post_final_digest"; then
            :
          else
            exit 1
          fi

          printf 'wrapper release: %s\n' "$WRAPPER_RELEASE"
          printf 'Xray version: %s\n' "$XRAY_VERSION"
          printf 'accepted source SHA: %s\n' "$ACCEPTED_SOURCE_SHA"
          printf 'accepted RC Git tag: %s\n' "$ACCEPTED_RC_TAG"
          printf 'accepted RC image: %s\n' "$RC_IMAGE"
          printf 'accepted digest: %s\n' "$accepted_digest"
          printf 'final image: %s\n' "$FINAL_IMAGE"
          printf 'final digest: %s\n' "$post_final_digest"
          echo 'RC/final digest equality: PASS'
